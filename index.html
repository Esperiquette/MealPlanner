<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Meal Planner</title><style>
:root{--bg:#f4f1ea;--fg:#3d3a34;--line:#ddd6c7;--accent:#8a9a7e;--card:#fbf9f4}
*{box-sizing:border-box}body{margin:0;font-family:'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--fg);padding:2rem 1rem 5rem}
h1{font-weight:300;letter-spacing:.08em;text-align:center;margin:0 0 1rem;font-size:1.6rem}
.grid{display:grid;grid-template-columns:80px repeat(7,1fr);gap:1px;background:var(--line);max-width:1400px;margin:0 auto;border:1px solid var(--line)}
.cell{background:var(--card);padding:.5rem}
.hdr{background:var(--bg);text-align:center;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;padding:.7rem .3rem;color:#7a7566}
.meal-lbl{display:flex;align-items:center;justify-content:center;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#7a7566;background:var(--bg)}
input,textarea{width:100%;border:none;background:transparent;font-family:inherit;color:var(--fg);font-size:.82rem;resize:none;outline:none;padding:.2rem 0}
input{font-weight:600;border-bottom:1px solid var(--line);margin-bottom:.3rem;padding-bottom:.3rem}
textarea{height:3.2em}
input::placeholder,textarea::placeholder{color:#b3ac9c}
.bar{max-width:1400px;margin:2rem auto 0;text-align:center}
button{background:var(--accent);color:#fff;border:none;padding:.7rem 1.6rem;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;border-radius:2px;cursor:pointer}
button:hover{opacity:.88}
#modal{display:none;position:fixed;inset:0;background:rgba(61,58,52,.4);align-items:center;justify-content:center}
#modal.show{display:flex}
.box{background:var(--card);padding:2rem;border-radius:4px;max-width:420px;width:90%;max-height:80vh;overflow:auto}
.box h2{font-weight:300;margin-top:0}
.box ul{padding-left:1.2rem;line-height:1.7}
.box button{margin-top:1rem}
#authBar{max-width:1400px;margin:0 auto 2rem;text-align:center}
#userInfo{font-size:.8rem;color:#7a7566;margin-bottom:.6rem;letter-spacing:.03em}
#signOutBtn{background:transparent;color:var(--fg);border:1px solid var(--line);padding:.4rem 1rem}
#loginBox{max-width:280px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1.6rem}
#loginBox input{border:none;border-bottom:1px solid var(--line);margin-bottom:1rem;padding:.4rem 0;font-weight:400}
#loginBox button{width:100%}
#loginErr{color:#b3543d;font-size:.75rem;margin:-.5rem 0 1rem;min-height:1em}
.hidden{display:none!important}
</style>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBxGKVXPMk_MH3GJA0KK0nGSMdmwySfnXw",
    authDomain: "food-84ee1.firebaseapp.com",
    databaseURL: "https://food-84ee1-default-rtdb.firebaseio.com",
    projectId: "food-84ee1",
    storageBucket: "food-84ee1.firebasestorage.app",
    messagingSenderId: "1077540752155",
    appId: "1:1077540752155:web:50e91eaf10718d784c21be",
    measurementId: "G-WPMVJZQDEZ"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  let localData = {};
  let dbListenerStarted = false;

  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],meals=['Breakfast','Lunch','Dinner'];
  const grid=document.getElementById('grid');
  grid.appendChild(Object.assign(document.createElement('div'),{className:'cell hdr'}));
  days.forEach(d=>grid.appendChild(Object.assign(document.createElement('div'),{className:'hdr',textContent:d})));
  meals.forEach(m=>{
    grid.appendChild(Object.assign(document.createElement('div'),{className:'meal-lbl',textContent:m}));
    days.forEach(d=>{
      const id=d+'-'+m;
      const c=document.createElement('div');c.className='cell';
      c.innerHTML=`<input placeholder="Meal" id="meal-${id}" data-id="${id}" data-f="meal"><textarea placeholder="Ingredients (comma sep)" id="ing-${id}" data-id="${id}" data-f="ing"></textarea>`;
      grid.appendChild(c);
    });
  });

  function startDbListener(){
    if(dbListenerStarted)return;
    dbListenerStarted=true;
    const planRef = ref(db, 'mealplan');
    onValue(planRef, (snapshot) => {
      const data = snapshot.val() || {};
      localData = data;
      Object.keys(data).forEach(id => {
        const mealInput = document.getElementById(`meal-${id}`);
        const ingInput = document.getElementById(`ing-${id}`);
        if (mealInput && document.activeElement !== mealInput) mealInput.value = data[id].meal || '';
        if (ingInput && document.activeElement !== ingInput) ingInput.value = data[id].ing || '';
      });
    });
  }

  grid.addEventListener('input', e => {
    const {id,f}=e.target.dataset;if(!id)return;
    localData[id] = localData[id] || {meal:'', ing:''};
    localData[id][f] = e.target.value;
    set(ref(db, 'mealplan/' + id), localData[id]);
  });

  window.compile = function() {
    const setList=new Set();
    Object.values(localData).forEach(v=>(v.ing||'').split(',').forEach(i=>{i=i.trim();if(i)setList.add(i)}));
    const list=document.getElementById('list');
    list.innerHTML=[...setList].sort().map(i=>`<li>${i}</li>`).join('')||'<li>No ingredients yet</li>';
    document.getElementById('modal').classList.add('show');
  }

  window.doLogin = function() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginErr');
    errEl.textContent = '';
    signInWithEmailAndPassword(auth, email, pass).catch(err => {
      errEl.textContent = 'Login failed: check email and password.';
    });
  };
  window.doSignOut = () => signOut(auth);

  onAuthStateChanged(auth, (user) => {
    const loginBox = document.getElementById('loginBox');
    const userInfo = document.getElementById('userInfo');
    const signOutBtn = document.getElementById('signOutBtn');
    const gridEl = document.getElementById('grid');
    const barEl = document.getElementById('actionBar');

    if (user) {
      loginBox.classList.add('hidden');
      userInfo.textContent = `Signed in as ${user.email}`;
      userInfo.classList.remove('hidden');
      signOutBtn.classList.remove('hidden');
      gridEl.classList.remove('hidden');
      barEl.classList.remove('hidden');
      startDbListener();
    } else {
      loginBox.classList.remove('hidden');
      userInfo.classList.add('hidden');
      signOutBtn.classList.add('hidden');
      gridEl.classList.add('hidden');
      barEl.classList.add('hidden');
    }
  });
</script>
</head><body>
<h1>Weekly Meal Planner</h1>
<div id="authBar">
  <div id="userInfo" class="hidden"></div>
  <button id="signOutBtn" class="hidden" onclick="doSignOut()">Sign Out</button>
  <div id="loginBox">
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPass" placeholder="Password">
    <div id="loginErr"></div>
    <button onclick="doLogin()">Login</button>
  </div>
</div>
<div class="grid hidden" id="grid"></div>
<div class="bar hidden" id="actionBar"><button onclick="compile()">Compile Grocery List</button></div>
<div id="modal"><div class="box"><h2>Grocery List</h2><ul id="list"></ul><button onclick="document.getElementById('modal').classList.remove('show')">Close</button></div></div>
</body></html>
