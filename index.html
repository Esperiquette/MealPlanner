          <button type="button" class="recipe-open" data-id="${id}" title="Open recipe">&#8599;</button>
        </div>
        <div class="ing-list" id="ing-list-${id}"></div>
        <button type="button" class="add-ing" data-id="${id}">+ Add ingredient</button>`;
      panel.appendChild(card);
    });
    mainEl.appendChild(panel);
  });

  function renderTabLabels(){
    const today = new Date();
    days.forEach((d, i) => {
      const date = weekDates[i];
      const tab = document.getElementById('tab-' + d);
      tab.querySelector('.tab-date').textContent = date.getDate();
      tab.classList.toggle('today', sameDay(date, today));
    });
    document.getElementById('weekRange').textContent = `${shortDate(weekDates[0])} \u2013 ${shortDate(weekDates[6])}`;
  }
  renderTabLabels();

  function showDay(d){
    document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active', days[i]===d));
    document.querySelectorAll('.day-panel').forEach(p=>p.classList.toggle('active', p.id === 'panel-'+d));
    // textareas that got their value set while their panel was hidden (display:none)
    // have scrollHeight 0 at that time, so their height stays stuck at 0 until now
    document.querySelectorAll('#panel-' + d + ' textarea.meal-name').forEach(autoResize);
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  function saveMeal(id){
    set(ref(db, 'mealplan/' + weekId() + '/' + id), localData[id]);
  }

  function clearDish(id){
    localData[id] = blankMeal();
    const mealInput = document.getElementById('meal-' + id);
    if (mealInput) { mealInput.value = ''; autoResize(mealInput); }
    const urlInput = document.getElementById('url-' + id);
    if (urlInput) urlInput.value = '';
    renderIngredients(id);
    saveMeal(id);
    if (viewMode === 'type') renderTypeView();
  }

  function renderIngredients(id){
    const container = document.getElementById('ing-list-' + id);
    if (container.contains(document.activeElement)) return; // don't disrupt active typing
    const list = (localData[id].ingredients && localData[id].ingredients.length) ? localData[id].ingredients : [{name:'',qty:''}];
    container.innerHTML = '';
    list.forEach((ing, idx) => {
      const row = document.createElement('div');
      const key = keyFor(ing.name || '');
      const isHave = key && groceryStatus[key];
      row.className = 'ing-row';
      row.innerHTML = `<button type="button" class="ing-have${isHave ? ' have' : ''}" data-id="${id}" data-idx="${idx}" title="${isHave ? 'Have it' : 'Need it'}">${isHave ? '<svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg>' : ''}</button>
        <input class="qty" placeholder="qty" value="${(ing.qty||'').replace(/"/g,'&quot;')}" data-id="${id}" data-idx="${idx}" data-f="qty">
        <input class="name" placeholder="Ingredient" value="${(ing.name||'').replace(/"/g,'&quot;')}" data-id="${id}" data-idx="${idx}" data-f="name">
        <button type="button" class="rm" data-id="${id}" data-idx="${idx}">&times;</button>`;
      container.appendChild(row);
    });
  }

  days.forEach(d => meals.forEach(m => renderIngredients(d + '-' + m)));

  function loadWeek(){
    if (unsubscribePlan) { unsubscribePlan(); unsubscribePlan = null; }
    if (unsubscribeUnassigned) { unsubscribeUnassigned(); unsubscribeUnassigned = null; }
    // clear UI immediately so old week's data doesn't flash
    days.forEach(d => meals.forEach(m => {
      const id = d + '-' + m;
      localData[id] = blankMeal();
      const mealInput = document.getElementById(`meal-${id}`);
      if (mealInput) { mealInput.value = ''; autoResize(mealInput); }
      const urlInput = document.getElementById(`url-${id}`);
      if (urlInput) urlInput.value = '';
      renderIngredients(id);
    }));
    unassignedData = {};
    renderUnplaced();
    renderTabLabels();
    const planRef = ref(db, 'mealplan/' + weekId());
    unsubscribePlan = onValue(planRef, (snapshot) => {
      const data = snapshot.val() || {};
      days.forEach(d => meals.forEach(m => {
        const id = d + '-' + m;
        const incoming = data[id] || blankMeal();
        if (!incoming.ingredients) incoming.ingredients = [{name:'',qty:''}];
        if (incoming.url === undefined) incoming.url = '';
        localData[id] = incoming;
        const mealInput = document.getElementById(`meal-${id}`);
        if (mealInput && document.activeElement !== mealInput) {
          mealInput.value = incoming.meal || '';
          autoResize(mealInput);
        }
        const urlInput = document.getElementById(`url-${id}`);
        if (urlInput && document.activeElement !== urlInput) urlInput.value = incoming.url || '';
        renderIngredients(id);
      }));
      if (viewMode === 'type') renderTypeView();
    });
    const unassignedRef = ref(db, 'unassigned/' + weekId());
    unsubscribeUnassigned = onValue(unassignedRef, (snapshot) => {
      unassignedData = snapshot.val() || {};
      renderUnplaced();
      if (viewMode === 'type') renderTypeView();
    });
  }

  function startDbListener(){
    if (statusListenerStarted) { loadWeek(); return; }
    statusListenerStarted = true;
    loadWeek();
    const statusRef = ref(db, 'groceryStatus');
    onValue(statusRef, (snapshot) => {
      groceryStatus = snapshot.val() || {};
      days.forEach(d => meals.forEach(m => renderIngredients(d + '-' + m)));
      if (document.getElementById('modal').classList.contains('show')) renderGroceryList();
    });
  }

  window.prevWeek = function(){ currentMonday = addDays(currentMonday, -7); weekDates = days.map((_,i)=>addDays(currentMonday,i)); loadWeek(); };
  window.nextWeek = function(){ currentMonday = addDays(currentMonday, 7); weekDates = days.map((_,i)=>addDays(currentMonday,i)); loadWeek(); };
  window.goToday = function(){ currentMonday = mondayOf(new Date()); weekDates = days.map((_,i)=>addDays(currentMonday,i)); loadWeek(); };

  function autoResize(el){
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  mainEl.addEventListener('input', e => {
    const id = e.target.dataset.id; if (!id) return;
    if (e.target.matches('textarea.meal-name')) {
      localData[id].meal = e.target.value;
      autoResize(e.target);
      saveMeal(id);
    } else if (e.target.matches('input.recipe-url')) {
      localData[id].url = e.target.value;
      saveMeal(id);
    } else if (e.target.matches('input.qty, input.name')) {
      const idx = +e.target.dataset.idx;
      const f = e.target.dataset.f;
      localData[id].ingredients[idx][f] = e.target.value;
      saveMeal(id);
    }
  });

  mainEl.addEventListener('click', e => {
    if (e.target.matches('.add-ing')) {
      const id = e.target.dataset.id;
      localData[id].ingredients.push({ name:'', qty:'' });
      renderIngredients(id);
      saveMeal(id);
    } else if (e.target.matches('.rm')) {
      const id = e.target.dataset.id;
      const idx = +e.target.dataset.idx;
      localData[id].ingredients.splice(idx, 1);
      if (!localData[id].ingredients.length) localData[id].ingredients = [{name:'',qty:''}];
      renderIngredients(id);
      saveMeal(id);
    } else if (e.target.closest('.ing-have')) {
      const btn = e.target.closest('.ing-have');
      const id = btn.dataset.id;
      const idx = +btn.dataset.idx;
      const name = localData[id].ingredients[idx].name || '';
      const key = keyFor(name);
      if (!key) return; // nothing typed yet, nothing to toggle
      const next = !groceryStatus[key];
      groceryStatus[key] = next;
      set(ref(db, 'groceryStatus/' + key), next);
      days.forEach(d => meals.forEach(m => renderIngredients(d + '-' + m)));
    } else if (e.target.closest('.recipe-open')) {
      const btn = e.target.closest('.recipe-open');
      const id = btn.dataset.id;
      const raw = (localData[id].url || '').trim();
      if (!raw) return;
      const url = /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
      window.open(url, '_blank', 'noopener');
    } else if (e.target.closest('.mcopy')) {
      const id = e.target.closest('.mcopy').dataset.id;
      const data = localData[id];
      const clip = {
        meal: data.meal || '',
        url: data.url || '',
        ingredients: (data.ingredients || []).map(i => ({ name: i.name || '', qty: i.qty || '' }))
      };
      localStorage.setItem('mealClipboard', JSON.stringify(clip));
      showToast('Meal copied');
    } else if (e.target.closest('.mpaste')) {
      const id = e.target.closest('.mpaste').dataset.id;
      const raw = localStorage.getItem('mealClipboard');
      if (!raw) { showToast('Nothing copied yet'); return; }
      const clip = JSON.parse(raw);
      localData[id].meal = clip.meal || '';
      localData[id].url = clip.url || '';
      localData[id].ingredients = (clip.ingredients && clip.ingredients.length)
        ? clip.ingredients.map(i => ({ name: i.name || '', qty: i.qty || '' }))
        : [{ name:'', qty:'' }];
      const mealInput = document.getElementById('meal-' + id);
      if (mealInput) { mealInput.value = localData[id].meal; autoResize(mealInput); }
      const urlInput = document.getElementById('url-' + id);
      if (urlInput) urlInput.value = localData[id].url;
      renderIngredients(id);
      saveMeal(id);
      showToast('Meal pasted');
    } else if (e.target.closest('.mdelete')) {
      const id = e.target.closest('.mdelete').dataset.id;
      const name = (localData[id].meal || '').trim();
      if (name && !confirm(`Delete "${name}" \u2014 this removes the dish, its recipe link, and all its ingredients.`)) return;
      clearDish(id);
      showToast('Dish deleted');
    }
  });

  window.manualSave = function(){
    days.forEach(d => meals.forEach(m => saveMeal(d + '-' + m)));
    showToast('Saved ✓');
  };

  // ---------- View toggle: By Day vs By Meal Type (no dates) ----------
  window.setViewMode = function(mode){
    viewMode = mode;
    document.getElementById('dayView').classList.toggle('hidden', mode !== 'day');
    document.getElementById('typeView').classList.toggle('hidden', mode !== 'type');
    document.getElementById('dayViewBtn').classList.toggle('active', mode === 'day');
    document.getElementById('typeViewBtn').classList.toggle('active', mode === 'type');
    if (mode === 'type') renderTypeView();

  function renderTvCard(id, e, isUnplaced){
    const rawUrl = (e.url || '').trim();
    const href = rawUrl ? (/^https?:\/\//i.test(rawUrl) ? rawUrl : 'https://' + rawUrl) : '';
    const ingLines = (e.ingredients || [])
      .filter(i => (i.name || '').trim())
      .map(i => `<li>${i.qty ? i.qty + ' \u2014 ' : ''}${i.name}</li>`)
      .join('');
    const delClass = isUnplaced ? 'tv-unplaced-del' : 'tv-delete';
    return `<div class="tv-dish${isUnplaced ? ' unplaced-dish' : ''}">
      ${isUnplaced ? '<span class="tv-badge">Not yet placed</span>' : ''}
      <div class="tv-dish-head">
        <span class="tv-dish-name">${e.meal}</span>
        <div class="tv-dish-actions">
          ${href ? `<a class="tv-link" href="${href}" target="_blank" rel="noopener">Recipe &#8599;</a>` : ''}
          <button type="button" class="${delClass}" data-id="${id}">Delete</button>
        </div>
      </div>
      ${ingLines ? `<ul class="tv-ing">${ingLines}</ul>` : ''}
    </div>`;
  }

  function renderTypeView(){
    const container = document.getElementById('typeView');
    container.innerHTML = meals.map(m => {
      const placed = days
        .map(d => ({ id: d + '-' + m, entry: localData[d + '-' + m] }))
        .filter(x => x.entry && (x.entry.meal || '').trim());
      const unplaced = Object.keys(unassignedData)
        .filter(id => unassignedData[id].type === m)
        .map(id => ({ id, entry: unassignedData[id] }));
      const placedHtml = placed.map(x => renderTvCard(x.id, x.entry, false)).join('');
      const unplacedHtml = unplaced.map(x => renderTvCard(x.id, x.entry, true)).join('');
      const body = (placedHtml + unplacedHtml) || '<div class="tv-empty">Nothing planned yet</div>';
      const formArea = addFormType === m ? renderAddForm(m) : `<button type="button" class="tv-add-btn" data-type="${m}">+ Add dish</button>`;
      return `<div class="tv-section"><h3>${m} options</h3>${body}${formArea}</div>`;
    }).join('');
  }

  function renderAddForm(type){
    const ingRows = draftDish.ingredients.map((ing, idx) => `
      <div class="ing-row">
        <input class="qty adf-qty" placeholder="qty" value="${(ing.qty||'').replace(/"/g,'&quot;')}" data-idx="${idx}">
        <input class="name adf-name-ing" placeholder="Ingredient" value="${(ing.name||'').replace(/"/g,'&quot;')}" data-idx="${idx}">
        <button type="button" class="rm adf-rm-ing" data-idx="${idx}">&times;</button>
      </div>`).join('');
    return `<div class="add-dish-form">
      <input class="adf-name" placeholder="Dish name" value="${(draftDish.meal||'').replace(/"/g,'&quot;')}">
      <input class="adf-url" type="url" placeholder="Recipe link (optional)" value="${(draftDish.url||'').replace(/"/g,'&quot;')}">
      <div class="adf-ing-list">${ingRows}</div>
      <button type="button" class="add-ing adf-add-ing">+ Add ingredient</button>
      <div class="adf-actions">
        <button type="button" class="adf-cancel">Cancel</button>
        <button type="button" class="adf-save" data-type="${type}">Save dish</button>
      </div>
    </div>`;
  }

  function openAddForm(type){
    addFormType = type;
    draftDish = { meal:'', url:'', ingredients:[{name:'',qty:''}] };
    renderTypeView();
  }
  function closeAddForm(){
    addFormType = null;
    renderTypeView();
  }

  document.getElementById('typeView').addEventListener('click', e => {
    const tvUnplacedDel = e.target.closest('.tv-unplaced-del');
    if (tvUnplacedDel) {
      set(ref(db, 'unassigned/' + weekId() + '/' + tvUnplacedDel.dataset.id), null);
      return;
    }
    const tvDel = e.target.closest('.tv-delete');
    if (tvDel) {
      const id = tvDel.dataset.id;
      const name = (localData[id] && localData[id].meal || '').trim();
      if (name && !confirm(`Delete "${name}" \u2014 this removes the dish, its recipe link, and all its ingredients.`)) return;
      clearDish(id);
      return;
    }
    const addBtn = e.target.closest('.tv-add-btn');
    if (addBtn) { openAddForm(addBtn.dataset.type); return; }
    const cancelBtn = e.target.closest('.adf-cancel');
    if (cancelBtn) { closeAddForm(); return; }
    const addIngBtn = e.target.closest('.adf-add-ing');
    if (addIngBtn) { draftDish.ingredients.push({ name:'', qty:'' }); renderTypeView(); return; }
    const rmIngBtn = e.target.closest('.adf-rm-ing');
    if (rmIngBtn) {
      const idx = +rmIngBtn.dataset.idx;
      draftDish.ingredients.splice(idx, 1);
      if (!draftDish.ingredients.length) draftDish.ingredients = [{ name:'', qty:'' }];
      renderTypeView();
      return;
    }
    const saveBtn = e.target.closest('.adf-save');
    if (saveBtn) {
      const type = saveBtn.dataset.type;
      const name = (draftDish.meal || '').trim();
      if (!name) { showToast('Add a dish name first'); return; }
      const entryId = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const payload = {
        type,
        meal: name,
        url: (draftDish.url || '').trim(),
        ingredients: draftDish.ingredients
          .filter(i => (i.name || '').trim())
          .map(i => ({ name: i.name.trim(), qty: (i.qty || '').trim() }))
      };
      if (!payload.ingredients.length) payload.ingredients = [{ name:'', qty:'' }];
      unassignedData[entryId] = payload;
      set(ref(db, 'unassigned/' + weekId() + '/' + entryId), payload);
      closeAddForm();
      showToast('Added to ' + type + ' options');
    }
  });

  document.getElementById('typeView').addEventListener('input', e => {
    if (e.target.matches('.adf-name')) draftDish.meal = e.target.value;
    else if (e.target.matches('.adf-url')) draftDish.url = e.target.value;
    else if (e.target.matches('.adf-qty')) draftDish.ingredients[+e.target.dataset.idx].qty = e.target.value;
    else if (e.target.matches('.adf-name-ing')) draftDish.ingredients[+e.target.dataset.idx].name = e.target.value;
  });

  // ---------- Unplaced dishes (added from Type view, waiting for a day/meal slot) ----------
  function renderUnplaced(){
    const box = document.getElementById('unplacedBox');
    const ids = Object.keys(unassignedData);
    if (!ids.length) { box.classList.add('hidden'); box.innerHTML = ''; return; }
    box.classList.remove('hidden');
    box.innerHTML = `<h3>Unplaced dishes (${ids.length})</h3>` + ids.map(id => {
      const e = unassignedData[id];
      const name = (e.meal || 'Untitled dish');
      const pickerOpen = openPickerFor === id;
      return `<div class="up-item">
        <div class="up-head">
          <span class="up-name">${name}</span>
          <span class="up-type">${e.type}</span>
        </div>
        <div class="up-actions">
          <button type="button" class="up-place" data-id="${id}">Place</button>
          <button type="button" class="up-del" data-id="${id}">Delete</button>
        </div>
        ${pickerOpen ? `<div class="up-daypicker">${days.map(d => `<button type="button" class="up-day" data-id="${id}" data-day="${d}">${d}</button>`).join('')}</div>` : ''}
      </div>`;

  document.getElementById('unplacedBox').addEventListener('click', e => {
    const placeBtn = e.target.closest('.up-place');
    if (placeBtn) {
      const id = placeBtn.dataset.id;
      openPickerFor = (openPickerFor === id) ? null : id;
      renderUnplaced();
      return;
    }
    const delBtn = e.target.closest('.up-del');
    if (delBtn) {
      set(ref(db, 'unassigned/' + weekId() + '/' + delBtn.dataset.id), null);
      return;
    }
    const dayBtn = e.target.closest('.up-day');
    if (dayBtn) {
      const id = dayBtn.dataset.id;
      const day = dayBtn.dataset.day;
      const entry = unassignedData[id];
      const targetId = day + '-' + entry.type;
      const existingName = (localData[targetId] && localData[targetId].meal || '').trim();
      if (existingName && !confirm(`Replace "${existingName}" on ${day} ${entry.type} with "${entry.meal}"?`)) return;
      const payload = {
        meal: entry.meal || '',
        url: entry.url || '',
        ingredients: (entry.ingredients && entry.ingredients.length) ? entry.ingredients : [{ name:'', qty:'' }]
      };
      set(ref(db, 'mealplan/' + weekId() + '/' + targetId), payload);
      set(ref(db, 'unassigned/' + weekId() + '/' + id), null);
      openPickerFor = null;
      showToast('Placed on ' + day);
    }
  });

  function keyFor(name){ return name.trim().toLowerCase(); }

  function buildGroceryRows(){
    const map = new Map();
    Object.values(localData).forEach(v => {
      const recipe = (v.meal || '').trim() || 'Untitled dish';
      (v.ingredients || []).forEach(ing => {
        const name = (ing.name || '').trim();
        if (!name) return;
        const key = keyFor(name);
        if (!map.has(key)) map.set(key, { key, name, qtys: [], recipes: new Set() });
        const entry = map.get(key);
        const q = (ing.qty || '').trim();
        if (q) entry.qtys.push(q);
        entry.recipes.add(recipe);
      });
    });
    return [...map.values()]
      .map(r => ({ ...r, recipes: [...r.recipes] }))
      .sort((a,b) => a.name.localeCompare(b.name));
  }

  function renderGroceryList(){
    const rows = buildGroceryRows();
    const need = rows.filter(r => !groceryStatus[r.key]);
    const have = rows.filter(r => groceryStatus[r.key]);
    const rowHtml = (r, isHave) => `
      <button type="button" class="gl-item${isHave ? ' have' : ''}" data-key="${r.key}">
        <span class="gl-dot">${isHave ? '<svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg>' : ''}</span>
        <span class="gl-main">
          <span class="gl-name">${r.name}</span>
          ${r.recipes.length ? `<span class="gl-recipes">${r.recipes.join(', ')}</span>` : ''}
        </span>
        ${r.qtys.length ? `<span class="gl-qty">${r.qtys.join(', ')}</span>` : ''}
      </button>`;
    const list = document.getElementById('list');
    if (!rows.length) { list.innerHTML = '<div class="gl-empty">No ingredients yet</div>'; return; }
    list.innerHTML =
      `<div class="gl-sec-title">Need (${need.length})</div>` +
      (need.length ? need.map(r => rowHtml(r, false)).join('') : '<div class="gl-empty">Everything\u2019s covered</div>') +
      `<div class="gl-sec-title">Have (${have.length})</div>` +
      (have.length ? have.map(r => rowHtml(r, true)).join('') : '<div class="gl-empty">Nothing yet</div>');
  }

  document.getElementById('list').addEventListener('click', e => {
    const btn = e.target.closest('.gl-item');
    if (!btn) return;
    const key = btn.dataset.key;
    const next = !groceryStatus[key];
    groceryStatus[key] = next;
    set(ref(db, 'groceryStatus/' + key), next);
    renderGroceryList();

  window.compile = function() {

    document.getElementById('modal').classList.add('show');

  window.closeModal = () => document.getElementById('modal').classList.remove('show');

    list.innerHTML = days.map((d, i) => {

        return `<div class="ov-meal"><span class="lbl">${m}</span><span class="val${name ? '' : ' empty'}">${name || '—'}</span></div>`;
      }).join('');

    document.getElementById('overviewModal').classList.add('show');

  window.closeOverview = () => document.getElementById('overviewModal').classList.remove('show');

  // ---------- Month view ----------
  function getMonthWeeks(monthDate){
    const first = startOfMonth(monthDate);
    const last = new Date(monthDate.getFullYear(), monthDate.getMonth()+1, 0);
    const gridStart = mondayOf(first);
    const gridEndMonday = mondayOf(last);
    const weeks = [];
    let cur = new Date(gridStart);
    while (cur <= gridEndMonday) { weeks.push(new Date(cur)); cur = addDays(cur, 7); }
    return weeks;
  }

  async function loadMonthData(){
    const weeks = getMonthWeeks(currentMonthDate);
    await Promise.all(weeks.map(async wk => {
      const wId = isoDate(wk);
      const snap = await get(ref(db, 'mealplan/' + wId));
      monthCache[wId] = snap.exists() ? snap.val() : {};
    }));
    renderMonth();
  }

  function renderMonth(){
    const weeks = getMonthWeeks(currentMonthDate);
    document.getElementById('monthTitle').textContent = currentMonthDate.toLocaleDateString('en-US', { month:'long', year:'numeric' });
    const dowRow = `<div class="month-dow-row">${days.map(d => `<div class="md-dow">${d}</div>`).join('')}</div>`;
    const today = new Date();
    const monthIdx = currentMonthDate.getMonth();
    const weeksHtml = weeks.map(wk => {
      const wId = isoDate(wk);
      const wkDates = days.map((_, i) => addDays(wk, i));
      const range = `${shortDate(wkDates[0])} \u2013 ${shortDate(wkDates[6])}`;
      const data = monthCache[wId] || {};
      const cellsHtml = wkDates.map((dt, i) => {
        const iso = isoDate(dt);
        const dayName = days[i];
        const lines = meals.map(m => {
          const entry = data[dayName + '-' + m];
          const name = entry && entry.meal ? entry.meal.trim() : '';
          return name ? `<span class="md-line">${name}</span>` : '';
        }).join('');
        const outOfMonth = dt.getMonth() !== monthIdx;
        const isToday = sameDay(dt, today);
        const isSel = selectedMonthDate && sameDay(dt, selectedMonthDate);
        return `<button type="button" class="month-day${outOfMonth ? ' dim' : ''}${isToday ? ' today' : ''}${isSel ? ' selected' : ''}" data-date="${iso}">
          <span class="md-num">${dt.getDate()}</span>
          <span class="md-meals">${lines}</span>
        </button>`;
      }).join('');
      return `<div class="week-block">
        <div class="week-label-row">
          <span class="wk-range">${range}</span>
          <span class="wk-actions"><button type="button" class="wcopy" data-week="${wId}">Copy week</button><button type="button" class="wpaste" data-week="${wId}">Paste week</button></span>
        </div>
        <div class="month-days-row">${cellsHtml}</div>
      </div>`;
    }).join('');
    document.getElementById('monthGrid').innerHTML = dowRow + weeksHtml;
  }

  document.getElementById('monthGrid').addEventListener('click', e => {
    const wcopy = e.target.closest('.wcopy');
    if (wcopy) { copyWeek(wcopy.dataset.week); return; }
    const wpaste = e.target.closest('.wpaste');
    if (wpaste) { pasteWeek(wpaste.dataset.week); return; }
    const dayBtn = e.target.closest('.month-day');
    if (dayBtn) {
      selectedMonthDate = new Date(dayBtn.dataset.date + 'T00:00:00');
      document.getElementById('dayToolsLabel').textContent =
        selectedMonthDate.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }) + ' selected';
      renderMonth();
    }
  });

  function copyWeek(wId){
    const data = monthCache[wId] || {};
    localStorage.setItem('weekClipboard', JSON.stringify({ data }));
    showToast('Week copied');
  }
  async function pasteWeek(wId){
    const raw = localStorage.getItem('weekClipboard');
    if (!raw) { showToast('Nothing copied yet'); return; }
    const clip = JSON.parse(raw);
    await set(ref(db, 'mealplan/' + wId), clip.data || {});
    monthCache[wId] = clip.data || {};
    renderMonth();
    showToast('Week pasted');
  }

  window.copySelectedDay = function(){
    if (!selectedMonthDate) { showToast('Tap a day first'); return; }
    const wId = isoDate(mondayOf(selectedMonthDate));
    const dayName = days[(selectedMonthDate.getDay() + 6) % 7];
    const data = monthCache[wId] || {};
    const clip = { meals: {} };
    meals.forEach(m => {
      const entry = data[dayName + '-' + m] || blankMeal();
      clip.meals[m] = { meal: entry.meal || '', url: entry.url || '', ingredients: (entry.ingredients || []).map(i => ({ name: i.name || '', qty: i.qty || '' })) };
    });
    localStorage.setItem('dayClipboard', JSON.stringify(clip));
    showToast('Day copied');
  };

  window.pasteSelectedDay = async function(){
    if (!selectedMonthDate) { showToast('Tap a day first'); return; }
    const raw = localStorage.getItem('dayClipboard');
    if (!raw) { showToast('Nothing copied yet'); return; }
    const clip = JSON.parse(raw);
    const wId = isoDate(mondayOf(selectedMonthDate));
    const dayName = days[(selectedMonthDate.getDay() + 6) % 7];
    const updates = {};
    meals.forEach(m => { updates[dayName + '-' + m] = clip.meals[m] || blankMeal(); });
    await update(ref(db, 'mealplan/' + wId), updates);
    monthCache[wId] = { ...(monthCache[wId] || {}), ...updates };
    renderMonth();
    showToast('Day pasted');
  };

  window.gotoSelectedDay = function(){
    if (!selectedMonthDate) { showToast('Tap a day first'); return; }
    const dayName = days[(selectedMonthDate.getDay() + 6) % 7];
    currentMonday = mondayOf(selectedMonthDate);
    weekDates = days.map((_, i) => addDays(currentMonday, i));
    loadWeek();
    closeMonth();
    showDay(dayName);
  };

  window.prevMonth = function(){ currentMonthDate = new Date(currentMonthDate.getFullYear(), currentMonthDate.getMonth() - 1, 1); loadMonthData(); };
  window.nextMonth = function(){ currentMonthDate = new Date(currentMonthDate.getFullYear(), currentMonthDate.getMonth() + 1, 1); loadMonthData(); };

  window.showMonth = function(){
    currentMonthDate = startOfMonth(new Date(currentMonday));
    selectedMonthDate = null;
    document.getElementById('dayToolsLabel').textContent = 'Tap a day to copy or paste it';
    loadMonthData();
    document.getElementById('monthModal').classList.add('show');
  };
  window.closeMonth = () => document.getElementById('monthModal').classList.remove('show');

  window.doLogin = function() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginErr');
    errEl.textContent = '';
    signInWithEmailAndPassword(auth, email, pass).catch(() => {
      errEl.textContent = 'Login failed: check email and password.';
    });
  };
  window.doSignOut = () => signOut(auth);

  onAuthStateChanged(auth, (user) => {
    const loginWrap = document.getElementById('loginWrap');
    const app_ = document.getElementById('app');
    const userInfo = document.getElementById('userInfo');
    const signOutBtn = document.getElementById('signOutBtn');

    if (user) {
      loginWrap.classList.add('hidden');
      app_.classList.remove('hidden');
      userInfo.textContent = user.email;
      signOutBtn.classList.remove('hidden');
      startDbListener();
    } else {
      loginWrap.classList.remove('hidden');
      app_.classList.add('hidden');
      userInfo.textContent = '';
      signOutBtn.classList.add('hidden');
    }
  });
</script>
</head><body>

<div id="toast"></div>

<div id="loginWrap">
  <div id="loginBox">
    <h2>Sign in to plan</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPass" placeholder="Password">
    <div id="loginErr"></div>
    <button onclick="doLogin()">Login</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Meal Planner</h1>
    <div id="userInfo"></div>
    <button id="signOutBtn" class="hidden" onclick="doSignOut()">Sign out</button>
  </header>
  <div class="view-toggle">
    <button id="dayViewBtn" class="view-btn active" onclick="setViewMode('day')">By Day</button>
    <button id="typeViewBtn" class="view-btn" onclick="setViewMode('type')">By Meal</button>
  </div>
  <div id="dayView">
    <div class="week-nav">
      <button onclick="prevWeek()">&lsaquo;</button>
      <span class="week-range" id="weekRange"></span>
      <button onclick="nextWeek()">&rsaquo;</button>
    </div>
    <button class="today-link" onclick="goToday()">Jump to this week</button>
    <div id="unplacedBox" class="unplaced hidden"></div>
    <div class="tabs" id="tabs"></div>
    <button class="overview-btn" onclick="showOverview()">View full week</button>
    <button class="overview-btn" onclick="showMonth()">View month</button>
    <main id="main"></main>
  </div>
  <div id="typeView" class="hidden"></div>
  <div class="fab-row">
    <button class="fab secondary" onclick="manualSave()">Save</button>
    <button class="fab" onclick="compile()">Grocery List</button>
  </div>
</div>

<div id="modal">
  <div class="sheet">
    <h2>Grocery List</h2>
    <div class="sheet-scroll">
      <div id="list"></div>
    </div>
    <button class="close-btn" onclick="closeModal()">Close</button>
  </div>
</div>

<div id="overviewModal">
  <div class="sheet">
    <h2>Week at a Glance <span id="overviewRange" style="display:block;font-size:.75rem;color:var(--sub);font-weight:400;margin-top:.15rem"></span></h2>
    <div class="sheet-scroll">
      <div id="overviewList"></div>
    </div>
    <button class="close-btn" onclick="closeOverview()">Close</button>
  </div>
</div>

<div id="monthModal">
  <div class="sheet month-sheet">
    <div class="month-head">
      <button onclick="prevMonth()">&lsaquo;</button>
      <span id="monthTitle"></span>
      <button onclick="nextMonth()">&rsaquo;</button>
    </div>
    <div class="sheet-scroll">
      <div id="monthGrid"></div>
      <div class="day-tools">
        <span id="dayToolsLabel">Tap a day to copy or paste it</span>
        <div class="day-tools-actions">
          <button type="button" onclick="copySelectedDay()">Copy day</button>
          <button type="button" onclick="pasteSelectedDay()">Paste day</button>
          <button type="button" onclick="gotoSelectedDay()">Open day</button>
        </div>
      </div>
    </div>
    <button class="close-btn" onclick="closeMonth()">Close</button>
  </div>
</div>

</body></html>
